name: Fetch water quality

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch from HaV
        run: node scripts/fetch-water.mjs

      - name: Commit water.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add water.json
          git diff --staged --quiet || git commit -m "Update water quality data [skip ci]"
          git push
