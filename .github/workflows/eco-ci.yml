name: CI energy
on: [push, workflow_dispatch]
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Start measurement
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: start-measurement
          json-output: "true"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Measure install
        id: measure-install
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: npm install
          json-output: "true"

      - run: npm run build

      - name: Measure build
        id: measure-build
        uses: green-coding-solutions/eco-ci-energy-estimation@v5
        with:
          task: get-measurement
          label: next build
          json-output: "true"

      - name: Save energy data
        env:
          BUILD_JSON: ${{ steps.measure-build.outputs.data-lap-json }}
        run: |
          PREV_TOTAL=$(jq '[.steps[].energy_joules | tonumber] | add // 0' energy.json 2>/dev/null || echo 0)
          B="${BUILD_JSON:-null}"

          jq -n \
            --argjson build "$B" \
            --argjson prev "$PREV_TOTAL" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg run "${{ github.run_number }}" \
            --arg url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              timestamp: $ts,
              run_id: $run,
              workflow_url: $url,
              previous_total_joules: $prev,
              steps: (if $build == null then [] else ($build.steps // []) end)
            }' > energy.json

          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add energy.json
          git diff --staged --quiet || git commit -m "chore: update energy metrics [skip ci]"
          git push
