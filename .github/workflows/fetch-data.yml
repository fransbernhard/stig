name: Fetch external data
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch and save data
        run: NODE_TLS_REJECT_UNAUTHORIZED=0 node scripts/fetch-data.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/
          git diff --staged --quiet || git commit -m "chore: refresh external data [skip ci]"
          git push
